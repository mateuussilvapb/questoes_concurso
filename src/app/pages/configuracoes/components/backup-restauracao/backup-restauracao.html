<app-layout-base-pages title="Backup e Restauração" subtitle="Realize backups e restaure dados">
  <div class="w-full grid justify-content-center">
    <!-- Exportação -->
    <div class="col-12 lg:col-6">
      <p-card>
        <ng-template #title>
          <div class="w-full flex flex-row gap-2 align-items-center m-0 p-0 text-sm">
            <em class="pi pi-upload"></em>
            <h2 class="m-0 p-0">Exportar</h2>
          </div>
        </ng-template>

        <div class="mt-3 mb-2 text-color-secondary">
          <span>Gera um arquivo JSON com matérias, assuntos, bancas, questões e histórico. </span>
        </div>

        <p-button
          [label]="'Exportar'"
          (onClick)="backup()"
          class="w-full button-aplicacao-style"
          styleClass="w-full button-aplicacao-style"
        />
      </p-card>
    </div>

    <!-- Importação -->
    <div class="col-12 lg:col-6">
      <p-card>
        <ng-template #title>
          <div class="w-full flex flex-row gap-2 align-items-center m-0 p-0 text-sm">
            <em class="pi pi-download"></em>
            <h2 class="m-0 p-0">Importar</h2>
          </div>
        </ng-template>

        <div class="mt-3 mb-2 text-color-secondary">
          <span>Selecione um arquivo de backup para restaurar. </span>
        </div>

        <p-button
          [label]="'Importar'"
          (onClick)="fileInput.click()"
          class="w-full button-aplicacao-style"
          styleClass="w-full button-aplicacao-style"
        />
      </p-card>
    </div>
  </div>
</app-layout-base-pages>

<input #fileInput type="file" accept=".json" hidden (change)="onFileSelected($event)" />
