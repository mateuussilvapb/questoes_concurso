<app-layout-base-pages [title]="'Acompanhar Estatísticas'" [subtitle]="'Acompanhe sua evolução'">
  @if (semHistoricoAlgum()) {
    <app-estatistica-vazia modo="sem-historico" (acaoClick)="onIrParaResolverQuestoes()" />
  } @else {
    <p-card header="Filtros">
      <app-estatistica-filter [form]="form" (atualizar)="carregar()" />
    </p-card>

    @if (granularidadePromovida()) {
      <p-message
        severity="info"
        styleClass="w-full mt-3"
        text="Período longo: agrupado por semana."
      />
    }

    @if (semResultadoNoFiltro()) {
      <div class="mt-3">
        <app-estatistica-vazia modo="sem-resultado" (acaoClick)="onLimparFiltros()" />
      </div>
    } @else {
      <div class="mt-3">
        <app-estatistica-kpi-cards [resumo]="painel().resumo" />
      </div>

      <div class="grid mt-1">
        <div class="col-12 lg:col-6">
          <app-grafico-evolucao [pontos]="painel().evolucao" [(granularidade)]="granularidade" />
        </div>
        <div class="col-12 lg:col-6">
          <app-grafico-acertos-erros [resumo]="painel().resumo" />
        </div>
      </div>

      <div class="grid mt-1">
        <div class="col-12 lg:col-6">
          <app-grafico-desempenho-grupo
            titulo="Desempenho por Matéria"
            [dados]="painel().porMateria"
            orientacao="horizontal"
            [limite]="10"
            ordenacao="volume"
          />
        </div>
        <div class="col-12 lg:col-6">
          <app-grafico-desempenho-grupo
            titulo="Desempenho por Assunto"
            subtitulo="Uma questão conta para todos os assuntos vinculados a ela."
            [dados]="painel().porAssunto"
            orientacao="horizontal"
            [limite]="10"
            ordenacao="volume"
          />
        </div>
      </div>

      <div class="grid mt-1">
        <div class="col-12 lg:col-6">
          <app-grafico-desempenho-grupo
            titulo="Desempenho por Dificuldade"
            [dados]="painel().porDificuldade"
            orientacao="vertical"
            [manterOrdem]="true"
            [limite]="5"
          />
        </div>
        <div class="col-12 lg:col-6">
          <app-ranking-pontos-fracos
            titulo="Pontos Fracos - Matéria"
            [itens]="painel().pontosFracosMateria"
          />
        </div>
      </div>

      <div class="mt-1">
        <app-ranking-pontos-fracos
          titulo="Pontos Fracos - Assunto"
          [itens]="painel().pontosFracosAssunto"
        />
      </div>

      <div class="mt-1">
        <app-analise-tempo
          [porMateria]="painel().porMateria"
          [porDificuldade]="painel().porDificuldade"
          [faixasTempo]="painel().faixasTempo"
        />
      </div>
    }
  }
</app-layout-base-pages>
