<div class="mt-3">
  <p-card>
    <div class="flex flex-column">
      <div class="flex flex-row justify-content-end align-items-center gap-2">
        <p-button
          size="small"
          rounded="true"
          variant="text"
          severity="info"
          pTooltip="Editar"
          icon="pi pi-pencil"
          aria-label="Editar"
          tooltipPosition="top"
          (onClick)="onEditar()"
        />
        <p-button
          size="small"
          rounded="true"
          variant="text"
          severity="danger"
          icon="pi pi-trash"
          pTooltip="Excluir"
          aria-label="Excluir"
          tooltipPosition="top"
          (onClick)="onExcluir()"
        />
      </div>
      <h2 class="text-lg font-medium">{{ materia().nome }}</h2>
      <p class="text-base font-light text-justify mt-2 conteudo-descricao">
        {{ materia().descricao || '-' }}
      </p>
      <div class="flex flex-row justify-content-start align-items-center gap-2 flex-wrap mt-3">
        <p-tag severity="info" class="text-xs" [value]="getTextAssuntosRelacionados()" /> |
        <p-tag severity="secondary" class="text-xs" [value]="getTextQuestoesRelacionadas()" />
      </div>
    </div>
  </p-card>
</div>
